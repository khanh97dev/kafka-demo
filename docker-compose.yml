# Kafka + N máy gửi (producer) + M máy nhận (consumer), giới hạn tài nguyên từng máy.
# Chạy:  ./deploy.sh up   rồi   ./deploy.sh scale <producer> <consumer>
name: kafka-demo

x-client: &client
  image: ${KAFKA_IMAGE:-apache/kafka:3.8.0}
  depends_on:
    topic-init: { condition: service_completed_successfully }
  networks: [kafka-net]
  restart: "no"

services:
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.8.0}
    container_name: kafka
    hostname: kafka
    ports: ["${KAFKA_PORT:-9092}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # sai tên topic thì báo lỗi thay vì tự tạo 1 partition
      KAFKA_NUM_NETWORK_THREADS: 3
      KAFKA_NUM_IO_THREADS: 4
      KAFKA_LOG_RETENTION_BYTES: 2147483648      # trần 2GB/partition, tránh đầy đĩa
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP:--Xms1g -Xmx1g}
    deploy:
      resources:
        limits: { cpus: "${KAFKA_CPUS:-2}", memory: "${KAFKA_MEM:-3g}", pids: 1024 }
    networks: [kafka-net]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  topic-init:
    image: ${KAFKA_IMAGE:-apache/kafka:3.8.0}
    depends_on:
      kafka: { condition: service_healthy }
    networks: [kafka-net]
    restart: "no"
    environment: { KAFKA_HEAP_OPTS: "-Xmx128m" }
    entrypoint: ["/bin/bash","-c"]
    command:
      - |
        B=kafka:19092; T=/opt/kafka/bin/kafka-topics.sh
        $$T --bootstrap-server $$B --create --if-not-exists --topic orders --partitions 3 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic payments --partitions 2 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic logs --partitions 6 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic live.viewer-events --partitions 3 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic ${BENCH_TOPIC:-bench} --partitions ${PARTITIONS:-6} --replication-factor 1
    deploy:
      resources: { limits: { cpus: "0.5", memory: 256m } }

  # ---- Máy GỬI: scale bằng  --scale producer=N ----
  producer:
    <<: *client
    environment: { KAFKA_HEAP_OPTS: "-Xms64m -Xmx256m" }
    entrypoint: ["/opt/kafka/bin/kafka-producer-perf-test.sh"]
    command:
      - --topic
      - ${BENCH_TOPIC:-bench}
      - --num-records
      - ${RECORDS:-1000000}
      - --record-size
      - ${SIZE:-100}
      - --throughput
      - ${THROUGHPUT:--1}
      - --producer-props
      - bootstrap.servers=kafka:19092
      - acks=1
      - linger.ms=10
      - batch.size=131072
      - compression.type=lz4
    deploy:
      resources: { limits: { cpus: "${CLIENT_CPUS:-0.5}", memory: "${CLIENT_MEM:-384m}" } }

  # ---- Máy NHẬN: scale bằng  --scale consumer=M (cùng group, chia partition) ----
  consumer:
    <<: *client
    environment: { KAFKA_HEAP_OPTS: "-Xms64m -Xmx256m" }
    entrypoint: ["/opt/kafka/bin/kafka-consumer-perf-test.sh"]
    command:
      - --bootstrap-server
      - kafka:19092
      - --topic
      - ${BENCH_TOPIC:-bench}
      - --group
      - ${GROUP:-g-bench}
      - --messages
      - "${RECORDS_TOTAL:-1000000}"
      - --timeout
      - "20000"
      - --reporting-interval
      - "5000"
      - --show-detailed-stats
    deploy:
      resources: { limits: { cpus: "${CLIENT_CPUS:-0.5}", memory: "${CLIENT_MEM:-384m}" } }

  web:
    image: nginx:alpine
    ports: ["${WEB_PORT:-8765}:80"]
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./sim.html:/usr/share/nginx/html/sim.html:ro
      - ./live.html:/usr/share/nginx/html/live.html:ro
    deploy:
      resources: { limits: { cpus: "0.25", memory: 64m } }
    networks: [kafka-net]

networks:
  kafka-net: {}
